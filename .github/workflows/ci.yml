name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  skills:
    name: Skill validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Lint workflows
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2
        with:
          shellcheck: true

      - name: Run skill verification scripts
        shell: pwsh
        run: |
          Get-ChildItem skills -Recurse -Filter 'verify-*.ps1' |
            Where-Object Name -ne 'verify-collect.ps1' |
            Sort-Object FullName |
            ForEach-Object {
              Write-Host "Running $($_.FullName)"
              & $_.FullName
            }
          # Some negative-path verifiers intentionally run a failing child process and
          # assert its exit code. Their assertions pass, but the native status persists.
          $global:LASTEXITCODE = 0
          # verify-collect.ps1 is an estate integration skeleton with intentional
          # <repos-root> placeholders; it cannot run in this standalone public repo.

  gate-coverage:
    name: Gate coverage
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Assert every job in this workflow is gated
        env:
          GATE_EXEMPT: ''
        run: python3 .github/scripts/assert_gate_coverage.py .github/workflows/ci.yml

  # Required status check. Deliberately a pure aggregator of needs.*.result: it decides
  # what can merge, so it has no checkout, no parser and no network of its own.
  #
  # `if: always()` is load-bearing. Without it the job is SKIPPED when an upstream job
  # fails, a skipped job emits no check run at all, and a required context that never
  # reports leaves the pull request permanently unmergeable.
  #
  # `skipped` counts as a pass, which is what lets job-level `if:` conditions and path
  # filtering work; `failure` and `cancelled` do not.
  ci-gate:
    name: CI Gate
    if: always()
    needs: [skills, gate-coverage]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Fail if any upstream job did not succeed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "Upstream results: ${{ join(needs.*.result, ', ') }}"
          exit 1
